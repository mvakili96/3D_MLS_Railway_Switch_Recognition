[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-mls"
version = "0.1.0"
description = "Source-faithful railway geometry and tracking foundations for 3D MLS data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
railway-mls = "railway_mls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
railway_mls = ["source_coverage.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
